<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>노래 관리</title>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="flex h-screen w-full border-4 border-black overflow-hidden">
      <div id="sidebar-container"></div>

      <main class="flex-1 bg-white p-8 overflow-y-auto">
        <div class="flex justify-between items-center w-full mb-8">
          <div class="flex items-center gap-6">
            <h1 class="text-3xl font-black">노래 관리</h1>
            <div class="relative inline-block">
              <button id="selectCategoryBtn" class="px-6 py-2 border-2 border-black font-bold text-lg hover:bg-black hover:text-white transition">카테고리 선택</button>
              <ul id="categoryDropdown" class="absolute left-0 mt-2 w-48 bg-white border-2 border-black hidden z-10 max-h-60 overflow-y-auto shadow-lg"></ul>
            </div>

            <button id="addSongBtn" class="px-6 py-2 ml-auto border-2 border-black font-bold text-lg hover:bg-black hover:text-white transition">곡 추가 +</button>
          </div>
        </div>
        <div class="border-4 border-black">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-200 border-b-4 border-black font-bold">
                <th class="p-4 border-r-2 border-black w-20 text-center">순위</th>
                <th class="p-4 border-r-2 border-black">제목</th>
                <th class="p-4 border-r-2 border-black">가수</th>
                <th class="p-4 border-r-2 border-black w-20 text-center">카테고리</th>
                <th class="p-4 border-r-2 border-black w-32 text-center">점수</th>
                <th class="p-4 text-center w-48">관리</th>
              </tr>
            </thead>
            <tbody id="songList"></tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="modal" class="fixed inset-0 bg-black hidden flex items-center justify-center z-50">
      <div class="bg-white border-4 border-black p-8 w-[400px]">
        <h2 id="newSong" class="text-2xl font-black mb-6 uppercase">신규 노래 등록</h2>

        <div class="space-y-4 text-lg">
          <div>
            <label for="titleInput" class="block font-black mb-1">제목</label>
            <input type="text" id="titleInput" class="w-full border-2 border-black p-2 outline-none focus:bg-yellow-50 font-bold" />
          </div>
          <div>
            <label for="artistInput" class="block font-black mb-1">가수</label>
            <input type="text" id="artistInput" class="w-full border-2 border-black p-2 outline-none focus:bg-yellow-50 font-bold" />
          </div>
          <div>
            <label for="categoryInput" class="block font-black mb-1">카테고리</label>
            <input type="text" id="categoryInput" class="w-full border-2 border-black p-2 outline-none focus:bg-yellow-50 font-bold" />
          </div>
          <div>
            <label for="scoreInput" class="block font-black mb-1">SCORE</label>
            <input type="number" id="scoreInput" class="w-full border-2 border-black p-2 outline-none focus:bg-yellow-50 font-bold" value="0" />
          </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
          <button id="youtubeLinkBtn" class="px-4 py-2 border-2 border-black font-bold hover:bg-gray-100">유튜브 링크 추가</button>
          <button id="closeSongBtn" class="px-4 py-2 border-2 border-black font-bold hover:bg-gray-100">닫기</button>
          <button id="saveSongBtn" class="px-6 py-2 bg-black text-white font-bold hover:bg-gray-800">저장</button>
        </div>
      </div>
    </div>

    <script>
      let songs = JSON.parse(localStorage.getItem('mySongs')) || [
        { title: 'Hysteria', artist: 'MUSE', category: '락/메탈', score: 95 },
        { title: 'Plug In Baby', artist: 'MUSE', category: '락/메탈', score: 88 },
      ];
      let editIndex = null;
      let tempYoutubeUrls = [];
      let categoryData = JSON.parse(localStorage.getItem('myCategory')) || [
        { title: '선택' },
        { title: '가요' },
        { title: 'POP' },
        { title: 'JPOP' },
        { title: '발라드' },
        { title: '댄스' },
        { title: '트로트' },
        { title: '포크' },
        { title: 'OST' },
        { title: '락/메탈' },
        { title: '랩/힙합' },
        { title: 'R&B/어반' },
      ];
      let currentFilter = '선택';

      const categoryDropdown = document.getElementById('categoryDropdown');
      const selectCategoryBtn = document.getElementById('selectCategoryBtn');
      const modal = document.getElementById('modal');
      const songList = document.getElementById('songList');
      const modalTitle = document.getElementById('newSong');
      const youtubeLinkBtn = document.getElementById('youtubeLinkBtn');
      const youtubeRegex = /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+$/;
      youtubeLinkBtn.addEventListener('click', () => {
        const url = prompt('유튜브 주소를 입력해주세요.');
        if (url === null) return;

        if (!youtubeRegex.test(url)) {
          alert('url 주소를 확인해 주세요');
          return;
        }

        tempYoutubeUrls.push(url);
        alert(`${tempYoutubeUrls.length}번의 유튜브 URL 등록이 완료되었습니다`);
      });

      const saveSongs = () => {
        localStorage.setItem('mySongs', JSON.stringify(songs));
      };

      const addSongBtn = document.getElementById('addSongBtn');
      addSongBtn.addEventListener('click', () => {
        editIndex = null;
        tempYoutubeUrls = [];
        modalTitle.textContent = '신규 노래 등록';
        document.getElementById('titleInput').value = '';
        document.getElementById('artistInput').value = '';
        document.getElementById('categoryInput').value = '';
        document.getElementById('scoreInput').value = 0;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });
      const closeSongBtn = document.getElementById('closeSongBtn');
      closeSongBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });

      const renderCategoryDropdown = () => {
        categoryDropdown.innerHTML = '';
        categoryData.forEach((info) => {
          const li = document.createElement('li');
          li.className = 'px-4 py-2 font-bold  border-gray-100 text-sm';
          li.textContent = info.title;
          li.addEventListener('click', () => {
            currentFilter = info.title;
            if (info.title === '전체') {
              selectCategoryBtn.textContent = '카테고리 선택';
            } else {
              selectCategoryBtn.textContent = info.title;
            }

            renderSongs();
            categoryDropdown.classList.add('hidden');
          });

          categoryDropdown.appendChild(li);
        });
      };

      selectCategoryBtn.onclick = (e) => {
        e.stopPropagation();
        categoryDropdown.classList.toggle('hidden');
      };

      document.onclick = () => categoryDropdown.classList.add('hidden');

      const renderSongs = () => {
        songList.innerHTML = '';

        let filteredSongs = songs;
        if (currentFilter !== '선택') {
          filteredSongs = songs.filter((song) => song.category === currentFilter);
        }
        filteredSongs.sort((a, b) => b.score - a.score || a.title.localeCompare(b.title));

        filteredSongs.forEach((song, index) => {
          const trCreate = document.createElement('tr');
          trCreate.className = 'border-b-2 border-black hover:bg-gray-50';

          const tdRank = document.createElement('td');
          tdRank.className = 'p-4 border-r-2 border-black text-center font-bold';
          tdRank.textContent = index + 1;

          const tdTitle = document.createElement('td');
          tdTitle.className = 'w-1/4 p-4 border-r-2 border-black font-bold';
          tdTitle.textContent = song.title;

          const tdCategory = document.createElement('td');
          tdCategory.className = 'p-4 border-r-2 border-black text-center';
          tdCategory.textContent = song.category;

          const tdArtist = document.createElement('td');
          tdArtist.className = 'w-1/4 p-4 border-r-2 border-black';
          tdArtist.textContent = song.artist;

          const tdScore = document.createElement('td');
          tdScore.className = 'p-4 border-r-2 border-black text-center font-black text-blue-600';
          tdScore.textContent = song.score;

          const tdManage = document.createElement('td');
          tdManage.className = 'p-4 flex justify-center items-center gap-4 text-xl font-bold';

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'hover:text-red-500 hover:scale-125 transition';
          deleteBtn.textContent = '✘';

          deleteBtn.addEventListener('click', function (click) {
            deleteSong(index);
          });

          const editBtn = document.createElement('button');
          editBtn.className = 'text-sm border-2 border-black px-2 py-1 hover:bg-black hover:text-white';
          editBtn.textContent = 'EDIT';

          editBtn.addEventListener('click', function () {
            editIndex = index;
            modalTitle.textContent = '노래 수정';
            document.getElementById('titleInput').value = song.title;
            document.getElementById('artistInput').value = song.artist;
            document.getElementById('categoryInput').value = song.category;
            document.getElementById('scoreInput').value = song.score;
            tempYoutubeUrls = song.url && Array.isArray(song.url) ? [...song.url] : [];
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          });

          tdManage.append(deleteBtn, editBtn);

          if (song.url && Array.isArray(song.url)) {
            song.url.forEach((url, urlIndex) => {
              if (url) {
                const urlSpan = document.createElement('span');
                urlSpan.className = 'bg-green-300 text-green-900 text-s px-2 py-1 rounded font-bold  hover:bg-green-400';
                urlSpan.textContent = `URL${urlIndex + 1}`;
                urlSpan.onclick = (e) => {
                  e.stopPropagation();
                  window.open(url, '_blank');
                };
                tdManage.appendChild(urlSpan);
              }
            });
          }

          trCreate.append(tdRank, tdTitle, tdArtist, tdCategory, tdScore, tdManage);

          songList.appendChild(trCreate);
        });
      };

      const saveSongBtn = document.getElementById('saveSongBtn');
      saveSongBtn.addEventListener('click', () => {
        const title = document.getElementById('titleInput').value;
        const artist = document.getElementById('artistInput').value;
        const category = document.getElementById('categoryInput').value;
        const score = parseInt(document.getElementById('scoreInput').value);

        if (title && artist && score !== null && !isNaN(score) && category) {
          const newSongData = {
            title,
            artist,
            category,
            score,
            url: [...tempYoutubeUrls],
          };
          if (editIndex !== null) {
            songs[editIndex] = newSongData;
            editIndex = null;
          } else {
            songs.push(newSongData);
          }
          saveSongs();
          renderSongs();
          tempYoutubeUrls = [];
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        } else {
          alert('내용이 입력되지 않았습니다!');
        }
      });

      window.deleteSong = (index) => {
        if (confirm('이 노래를 삭제하시겠습니까?')) {
          songs.splice(index, 1);

          renderSongs();
        }
      };
      renderCategoryDropdown();
      renderSongs();
    </script>
    <script src="./sidebar.js"></script>
  </body>
</html>
