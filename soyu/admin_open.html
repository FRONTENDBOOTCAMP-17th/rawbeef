<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 메뉴</title>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body class="bg-gray-100 font-sans">
    <div id="sidebar-container"></div>
    <script src="./sidebar.js"></script>
    <div id="loginScreen" class="hidden fixed inset-0 items-center justify-center bg-gray-100">
      <div class="bg-white rounded-xl shadow-md p-8 w-full max-w-sm">
        <h2 class="text-xl font-bold mb-6 text-gray-800">관리자 로그인</h2>

        <input id="passwordInput" type="password" placeholder="비밀번호를 입력하세요" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-blue-500 focus:border-transparent" />

        <p id="loginError" class="hidden mt-2 text-sm text-red-500">비밀번호가 일치하지 않습니다.</p>

        <button id="loginBtn" class="mt-4 w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white text-sm font-semibold rounded-lg transition-colors cursor-pointer">로그인</button>
      </div>
    </div>

    <div id="adminContent" class="hidden"></div>

    <script>
      const api = 'https://api.fullstackfamily.com/api/rawbeef/v1/auth/login';
      const mytoken = 'adminToken';

      const loginScreen = document.getElementById('loginScreen');
      const adminContent = document.getElementById('adminContent');
      const passwordInput = document.getElementById('passwordInput');
      const loginBtn = document.getElementById('loginBtn');
      const loginError = document.getElementById('loginError');

      function initCheck() {
        const token = localStorage.getItem(mytoken);
        token ? showAdmin() : showLogin();
      }

      function showAdmin() {
        loginScreen.classList.add('hidden');
        loginScreen.classList.remove('flex');
        adminContent.classList.remove('hidden');
      }

      function showLogin() {
        adminContent.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        loginScreen.classList.add('flex');
      }

      function showSuccessScreen() {
        const successPage = document.createElement('div');
        successPage.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:flex;align-items:center;justify-content:center;';

        const card = document.createElement('div');
        card.style.cssText = 'position:relative;background:white;border-radius:16px;padding:40px;width:600px;text-align:center;overflow:hidden;min-height:300px;';

        const fx = document.createElement('div');
        fx.style.cssText = 'position:absolute;inset:0;pointer-events:none;';

        const center = document.createElement('div');
        center.style.cssText = 'position:relative;z-index:2;text-align:center;';

        const emoji = document.createElement('div');
        emoji.textContent = '🎊';
        emoji.style.cssText = 'font-size:80px;';

        const title = document.createElement('div');
        title.textContent = '🎉 로그인 완료!!! 🎉';
        title.style.cssText = 'font-size:22px;font-weight:800;margin:10px 0 4px;';

        const sub = document.createElement('div');
        sub.textContent = '어서오세요 관리자님 👑';
        sub.style.cssText = 'font-size:14px;color:#555;margin:4px 0;';

        const info = document.createElement('div');
        info.textContent = '← 사이드바에서 메뉴를 골라주세요';
        info.style.cssText = 'font-size:13px;color:#aaa;margin-top:6px;';

        center.append(emoji, title, sub, info);
        card.append(fx, center);
        successPage.appendChild(card);
        document.body.appendChild(successPage);

        const style = document.createElement('style');
        style.textContent = `
    @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(600px) rotate(1080deg);opacity:0}}
    @keyframes duckRun{0%{left:-120px}100%{left:calc(100% + 120px)}}
    @keyframes popStar{0%{transform:scale(0);opacity:1}100%{transform:scale(1.5);opacity:0}}
  `;
        document.head.appendChild(style);

        const colors = ['#FF4444', '#FF8800', '#FFEE00', '#44CC44', '#4488FF', '#9944FF', '#FF44BB'];
        const shapes = ['★', '■', '●', '◆', '▲'];

        function confetti(n) {
          for (let i = 0; i < n; i++) {
            const el = document.createElement('div');
            el.textContent = Math.random() > 0.4 ? shapes[Math.floor(Math.random() * shapes.length)] : '';
            const size = 8 + Math.random() * 14;
            el.style.cssText = `position:absolute;left:${Math.random() * 100}%;top:-30px;font-size:${size}px;color:${colors[Math.floor(Math.random() * colors.length)]};animation:fall ${1 + Math.random() * 2}s ${Math.random()}s linear forwards;`;
            fx.appendChild(el);
            setTimeout(() => el.remove(), 3500);
          }
        }

        function duck() {
          const d = document.createElement('div');
          d.textContent = ['🦆', '🐥', '🐤'][Math.floor(Math.random() * 3)];
          d.style.cssText = `position:absolute;top:${10 + Math.random() * 70}%;left:-120px;font-size:${30 + Math.random() * 30}px;animation:duckRun ${1.5 + Math.random() * 1.5}s linear forwards;`;
          fx.appendChild(d);
          setTimeout(() => d.remove(), 3500);
        }

        confetti(60);
        setTimeout(() => confetti(50), 400);
        setTimeout(() => confetti(40), 900);
        for (let i = 0; i < 8; i++) setTimeout(duck, i * 400);

        const iv = setInterval(() => {
          confetti(20);
          duck();
        }, 1800);

        setTimeout(() => {
          clearInterval(iv);
          style.remove();
          successPage.style.transition = 'opacity 0.5s';
          successPage.style.opacity = '0';
          setTimeout(() => successPage.remove(), 500);
        }, 4000);
      }

      async function login() {
        const password = passwordInput.value.trim();
        if (!password) return;

        loginBtn.disabled = true;
        loginBtn.textContent = '로그인 중...';
        loginError.classList.add('hidden');

        try {
          const res = await fetch(api, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });

          if (res.ok) {
            const data = await res.json();
            localStorage.setItem(mytoken, data.data.token);
            showAdmin();
            showSuccessScreen();
          } else {
            loginError.classList.remove('hidden');
            passwordInput.value = '';
            passwordInput.focus();
          }
        } catch {
          loginError.textContent = '서버 연결에 실패했습니다.';
          loginError.classList.remove('hidden');
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = '로그인';
        }
      }

      loginBtn.addEventListener('click', login);
      passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
      });

      initCheck();
    </script>
  </body>
</html>
