<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 카테고리</title>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body class="bg-gray-100 dark:bg-gray-950 font-sans">
    <div id="header-container"></div>
    <script src="./header.js"></script>
    <div class="flex h-[calc(100vh-57px)] w-full overflow-hidden">
      <div id="sidebar-container"></div>

      <main class="flex-1 bg-white dark:bg-gray-900 p-8 relative overflow-y-auto">
        <div class="flex justify-between mb-10 max-w-4xl mx-auto">
          <h1 class="text-3xl py-2 font-black text-gray-900 dark:text-white">카테고리 관리</h1>
          <button id="addCategoryBtn" class="px-6 py-2 border-2 rounded-xl border-black dark:border-white font-bold text-lg hover:bg-black dark:hover:bg-white hover:text-white dark:hover:text-black transition dark:text-white">카테고리 추가 +</button>
        </div>

        <div class="space-y-4 max-w-4xl mx-auto">
          <div id="categoryList"></div>
        </div>
      </main>

      <div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 border-4 border-black dark:border-white p-8 w-[400px]">
          <h2 class="text-2xl font-black mb-6 uppercase text-gray-900 dark:text-white">신규 카테고리 등록</h2>

          <div class="space-y-4 text-lg">
            <div>
              <label for="titleInput" class="block font-black mb-1 text-gray-900 dark:text-white"></label>
              <input type="text" id="titleInput" class="w-full border-2 rounded-xl p-2 focus:bg-yellow-50 font-bold" />
            </div>
          </div>

          <div class="flex justify-end gap-4 mt-8">
            <button id="closeCategoryBtn" class="px-4 py-2 border-2 rounded-xl border-black dark:border-white font-bold hover:bg-gray-100 dark:hover:bg-gray-700 dark:text-white">닫기</button>
            <button id="saveCategoryBtn" class="px-6 py-2 bg-black rounded-xl dark:bg-white text-white dark:text-black font-bold hover:bg-gray-800 dark:hover:bg-gray-200">저장</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('adminToken');
      if (!token) {
        alert('로그인이 필요합니다.');
        location.href = './admin_open.html';
      }
      let category = [];
      async function loadCategories() {
        try {
          const res = await fetch('https://api.fullstackfamily.com/api/rawbeef/v1/categories');
          const json = await res.json();
          if (!res.ok) {
            alert('카테고리 불러오기에 실패했습니다.');
            return;
          }
          category = json.data;
          renderCategory();
        } catch {
          alert('카테고리 불러오기에 실패했습니다.');
        }
      }

      let editIndex = null;
      const modal = document.getElementById('modal');
      const categoryList = document.getElementById('categoryList');

      const saveCategory = async (title) => {
        try {
          const token = localStorage.getItem('adminToken');
          const res = await fetch('https://api.fullstackfamily.com/api/rawbeef/v1/categories', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ title }),
          });
          if (!res.ok) {
            alert('카테고리 저장에 실패했습니다.');
            return;
          }
          const json = await res.json();
          return json.data;
        } catch {
          alert('카테고리 저장에 실패했습니다.');
        }
      };

      const editCategory = async (id, newTitle) => {
        const token = localStorage.getItem('adminToken');
        const res = await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ title: newTitle }),
        });
        const json = await res.json();
        return json.data;
      };
      const addCategoryBtn = document.getElementById('addCategoryBtn');
      addCategoryBtn.addEventListener('click', () => {
        editIndex = null;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      const closeCategoryBtn = document.getElementById('closeCategoryBtn');
      closeCategoryBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });

      const moveCategoryUp = async (id) => {
        const token = localStorage.getItem('adminToken');
        await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${id}/move-up`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}` },
        });
        await loadCategories();
      };

      const moveCategoryDown = async (id) => {
        const token = localStorage.getItem('adminToken');
        await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${id}/move-down`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}` },
        });
        await loadCategories();
      };
      const renderCategory = () => {
        categoryList.innerHTML = '';

        category.forEach((item, index) => {
          const divCreate = document.createElement('div');
          divCreate.className = 'flex justify-between items-center px-6 py-4 mb-3  bg-gray-300 dark:bg-purple-300 text-black rounded-xl border border-purple-500 dark:border-white hover:border-purple-500 transition-all duration-200';

          const spanTitle = document.createElement('span');
          spanTitle.className = 'text-lg font-bold text-black ';
          spanTitle.textContent = item.title;

          const btnManage = document.createElement('div');
          btnManage.className = 'flex items-center gap-4';

          const upBtn = document.createElement('button');
          upBtn.textContent = '▲';
          upBtn.className = 'w-8 h-8 flex items-center justify-center text-gray-600 hover:text-cyan-400  text-xl';
          upBtn.addEventListener('click', async () => {
            await moveCategoryUp(item.id);
          });

          const downBtn = document.createElement('button');
          downBtn.textContent = '▼';
          downBtn.className = 'w-8 h-8 flex items-center justify-center text-gray-600 hover:text-cyan-400  transition-color text-xl';
          downBtn.addEventListener('click', async () => {
            await moveCategoryDown(item.id);
          });

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'categoryDeleteBtn  text-gray-400 hover:text-red-400 dark:text-black transition-color text-2xl hover:text-red-500 hover:scale-125';
          deleteBtn.textContent = '✘';

          deleteBtn.addEventListener('click', function () {
            deleteCategory(index);
          });

          const editBtn = document.createElement('button');
          editBtn.className = 'categoryEditBtn text-l text-bold hover:text-blue-700 text-black hover:scale-125 ';
          editBtn.textContent = 'EDIT';
          editBtn.addEventListener('click', function () {
            editIndex = index;
            document.querySelector('#modal h2').textContent = '카테고리 수정';
            document.getElementById('titleInput').value = item.title;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          });

          btnManage.append(upBtn, downBtn, deleteBtn, editBtn);
          divCreate.append(spanTitle, btnManage);

          categoryList.appendChild(divCreate);
          const categoryDeleteBtn = document.querySelectorAll('.categoryDeleteBtn');
        });
      };
      const saveCategoryBtn = document.getElementById('saveCategoryBtn');
      saveCategoryBtn.addEventListener('click', async () => {
        const titleInput = document.getElementById('titleInput');
        const title = titleInput.value;

        if (title) {
          if (editIndex !== null) {
            const oldTitle = category[editIndex].title;
            await editCategory(category[editIndex].id, title);
            await loadCategories();
            editIndex = null;
          } else {
            await saveCategory(title);
            await loadCategories();
          }
          renderCategory();

          modal.classList.add('hidden');
          modal.classList.remove('flex');
          titleInput.value = '';
          document.querySelector('#modal h2').textContent = '신규 카테고리 등록';
        } else {
          alert('카테고리 제목을 입력해주세요.');
        }
      });

      const deleteCategory = async (index) => {
        if (confirm('이 카테고리를 정말 삭제할까요?')) {
          const id = category[index].id;
          const token = localStorage.getItem('adminToken');
          await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` },
          });
          await loadCategories();
        }
      };

      loadCategories();
    </script>
    <script src="./sidebar.js"></script>
  </body>
</html>
