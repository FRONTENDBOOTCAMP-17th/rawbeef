<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 카테고리</title>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="flex h-screen w-full border-4 border-black overflow-hidden">
      <div id="sidebar-container"></div>

      <main class="flex-1 bg-white p-8 relative overflow-y-auto">
        <div class="flex justify-between mb-10">
          <h1 class="text-3xl py-2 font-black">카테고리 관리</h1>
          <button id="addCategoryBtn" class="px-6 py-2 border-2 border-black font-bold text-lg hover:bg-black hover:text-white transition">카테고리 추가 +</button>
        </div>

        <div class="space-y-4 max-w-4xl">
          <div id="categoryList"></div>
        </div>
      </main>

      <div id="modal" class="fixed inset-0 bg-black hidden flex items-center justify-center z-50">
        <div class="bg-white border-4 border-black p-8 w-[400px]">
          <h2 class="text-2xl font-black mb-6 uppercase">신규 카테고리 등록</h2>

          <div class="space-y-4 text-lg">
            <div>
              <label for="titleInput" class="block font-black mb-1">노래 카테고리</label>
              <input type="text" id="titleInput" class="w-full border-2 border-black p-2 outline-none focus:bg-yellow-50 font-bold" />
            </div>
          </div>

          <div class="flex justify-end gap-4 mt-8">
            <button id="closeCategoryBtn" class="px-4 py-2 border-2 border-black font-bold hover:bg-gray-100">닫기</button>
            <button id="saveCategoryBtn" class="px-6 py-2 bg-black text-white font-bold hover:bg-gray-800">저장</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let category = [];
      async function loadCategories() {
        const res = await fetch('https://api.fullstackfamily.com/api/rawbeef/v1/categories');
        const json = await res.json();
        category = json.data;
        renderCategory();
      }
      let editIndex = null;
      const modal = document.getElementById('modal');
      const categoryList = document.getElementById('categoryList');

      const saveCategory = async (title) => {
        const token = localStorage.getItem('adminToken');
        const res = await fetch('https://api.fullstackfamily.com/api/rawbeef/v1/categories', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ title }),
        });
        const json = await res.json();
        return json.data;
      };

      const editCategory = async (oldTitle, newTitle) => {
        const token = localStorage.getItem('adminToken');
        const res = await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${oldTitle}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ title: newTitle }),
        });
        const json = await res.json();
        return json.data;
      };
      const addCategoryBtn = document.getElementById('addCategoryBtn');
      addCategoryBtn.addEventListener('click', () => {
        editIndex = null;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });

      const closeCategoryBtn = document.getElementById('closeCategoryBtn');
      closeCategoryBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });

      const moveCategoryUp = async (title) => {
        const token = localStorage.getItem('adminToken');
        await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${title}/move-up`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}` },
        });
        await loadCategories();
      };

      const moveCategoryDown = async (title) => {
        const token = localStorage.getItem('adminToken');
        await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${title}/move-down`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}` },
        });
        await loadCategories();
      };
      const renderCategory = () => {
        categoryList.innerHTML = '';

        category.forEach((item, index) => {
          const mainCreate = document.createElement('main');
          mainCreate.className = ' flex-1 bg-white p-8 relative overflow-y-auto';

          const divCreate = document.createElement('div');
          divCreate.className = 'categoryBox flex mb-4 justify-between items-center p-4 border-2 border-black bg-white group hover:bg-gray-50';

          const spanTitle = document.createElement('span');
          spanTitle.className = 'text-xl font-bold';
          spanTitle.textContent = item.title;

          const btnManage = document.createElement('div');
          btnManage.className = 'flex items-center gap-4';

          const upBtn = document.createElement('button');
          upBtn.textContent = '▲';
          upBtn.className = 'text-xl hover:text-blue-500 hover:scale-125';
          upBtn.addEventListener('click', async () => {
            await moveCategoryUp(item.title);
          });

          const downBtn = document.createElement('button');
          downBtn.textContent = '▼';
          downBtn.className = 'text-xl hover:text-blue-500 hover:scale-125';
          downBtn.addEventListener('click', async () => {
            await moveCategoryDown(item.title);
          });

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'categoryDeleteBtn text-2xl hover:text-red-500 hover:scale-125';
          deleteBtn.textContent = '✘';

          deleteBtn.addEventListener('click', function () {
            deleteCategory(index);
          });

          const editBtn = document.createElement('button');
          editBtn.className = 'categoryEditBtn text-l hover:text-blue-500 hover:scale-125';
          editBtn.textContent = 'EDIT';
          editBtn.addEventListener('click', function () {
            editIndex = index;
            document.querySelector('#modal h2').textContent = '카테고리 수정';
            document.getElementById('titleInput').value = item.title;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          });

          btnManage.append(upBtn, downBtn, deleteBtn, editBtn);
          divCreate.append(spanTitle, btnManage);

          categoryList.appendChild(divCreate);
          const categoryDeleteBtn = document.querySelectorAll('.categoryDeleteBtn');
        });
      };
      const saveCategoryBtn = document.getElementById('saveCategoryBtn');
      saveCategoryBtn.addEventListener('click', async () => {
        const titleInput = document.getElementById('titleInput');
        const title = titleInput.value;

        if (title) {
          if (editIndex !== null) {
            const oldTitle = category[editIndex].title;
            await editCategory(oldTitle, title);
            await loadCategories();
            editIndex = null;
          } else {
            await saveCategory(title);
            await loadCategories();
          }
          renderCategory();
          saveCategory();
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          titleInput.value = '';
          document.querySelector('#modal h2').textContent = '신규 카테고리 등록';
        } else {
          alert('카테고리 제목을 입력해주세요.');
        }
      });

      const deleteCategory = async (index) => {
        if (confirm('이 카테고리를 정말 삭제할까요?')) {
          const title = category[index].title;
          const token = localStorage.getItem('adminToken');
          await fetch(`https://api.fullstackfamily.com/api/rawbeef/v1/categories/${title}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` },
          });
          await loadCategories();
        }
      };

      loadCategories();
    </script>
    <script src="./sidebar.js"></script>
  </body>
</html>
