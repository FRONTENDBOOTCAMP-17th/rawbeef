<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>노래 등록 신청하기</title>
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="flex h-screen w-full border-4 border-black overflow-hidden">
      <main class="flex-1 bg-white p-8 relative overflow-y-auto">
        <div class="flex justify-between mb-10">
          <h1 class="text-3xl py-2 font-black">노래 신청 관리</h1>
        </div>

                <div class="w-full max-w-4xl mx-auto p-6">
  <strong class="text-2xl font-black mb-6">노래 신청 목록</strong>
  
  <div class="border-4 border-black overflow-hidden rounded-lg">
        <div class="space-y-4 max-w-4xl">
          <div id="requestList"></div>
        </div>
                              <ul class="item-link">
                  <li>
                    <div class="registration-container">
                        <form id="songRequestForm">
                            <div class="input-group">
          <input type="text" id="postTitle" placeholder="제목" required maxlength="50" />
          </div>

        <div class="textarea-group">
          <textarea id="postContent" placeholder="신청 내용을 입력하세요 (최대 300자)" maxlength="300" required></textarea>
          <span class="char-count">0 / 300</span>
        </div>
        <input type="password" id="postPassword" placeholder="비밀번호" required />
        <br />
          <button class="post-btn">
    <span>등록</span>
    <span class="ico"></span>
  </button>

                    </form>
                    </div>
                  </li>
                </ul>
      </main>
      
  </div>
    <script></script>
  </body>
</html>
